name: rememberotter
description: "기억해달 프로젝트"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ─────────────── 기본 UI/위젯 ───────────────
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # ─────────────── 개발 편의성 ───────────────
  get: ^4.7.2

  # ─────────────── 기타 유틸 ───────────────
  logger: ^2.6.0
  uuid: ^4.5.1

  # ─────────────── 로컬 데이터베이스 ───────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─────────────── Hive 코드 생성 ───────────────
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: Maplestory
      fonts:
        - asset: assets/fonts/Maplestory Light.ttf
          weight: 300
        - asset: assets/fonts/Maplestory Bold.ttf
          weight: 700
