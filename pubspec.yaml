name: rememberotter
description: "기억해달 프로젝트"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ─────────────── 기본 UI/위젯 ───────────────
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # ─────────────── 개발 편의성 ───────────────
  get: ^4.7.2

  # ─────────────── 기타 유틸 ───────────────
  logger: ^2.6.0
  uuid: ^4.5.1

  # ─────────────── 로컬 데이터베이스 ───────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─────────────── 푸시 알림 ───────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  # ─────────────── 권한 관리 ───────────────
  permission_handler: ^12.0.1

  # ─────────────── 앱 정보 ───────────────
  package_info_plus: ^8.0.0

  # ─────────────── 피드백 ───────────────
  http: ^1.2.2
  device_info_plus: ^11.1.0

  # ─────────────── Firebase ───────────────
  firebase_core: ^3.13.0
  firebase_remote_config: ^5.3.0

  # ─────────────── URL 런처 ───────────────
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─────────────── Hive 코드 생성 ───────────────
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  # ─────────────── 앱 아이콘 ───────────────
  flutter_launcher_icons: ^0.14.3

  # ─────────────── 오픈소스 라이선스 ───────────────
  flutter_oss_licenses: ^3.0.4

flutter_oss_licenses:
  output: lib/oss_licenses.dart

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/common/
    - assets/images/logo/
    - assets/images/splash/

  fonts:
    - family: Maplestory
      fonts:
        - asset: assets/fonts/Maplestory Light.ttf
          weight: 300
        - asset: assets/fonts/Maplestory Bold.ttf
          weight: 700
